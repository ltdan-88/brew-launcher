name: CI

# Gates on every push/PR:
#
#   1. zsh -n  — syntax. Note ShellCheck is intentionally not used: it
#      doesn't support zsh (only sh/bash/dash/ksh), and forcing it to
#      treat this script as bash produces false positives on legitimate
#      zsh-only syntax (e.g. ${(@f)var} flag expansion, multi-line array
#      literals). zsh -n gives real signal for the language in use. Also
#      runs `python3 -m py_compile` on lib/brew-launcher/cache_writer.py
#      — it used to be a heredoc inside bin/brew-launcher itself (so
#      zsh -n covered it, opaquely, as inert heredoc text) and is now a
#      real standalone file that needs its own syntax gate.
#
#   2. cache round-trip test — behavior. Syntax checking alone could not
#      catch the v0.4.0 bug where the cache was written without a
#      trailing newline and every read loop silently dropped the last
#      entry, so there is a real test for that path now. Runs against
#      whatever real formulae exist on the machine, and skips on a bare
#      runner with none installed.
#
#   3. --list fixture test — the same surface, but against a cache and
#      state file written directly rather than a real `brew` install,
#      so it exercises hidden-entry filtering and output shape on any
#      runner, never skipping.
#
#   4. category-fixtures — load_category_names() sourced and called
#      directly against a fixture categories directory, covering
#      reserved-name skipping and Favorites ordering. No fzf or brew
#      needed, since it never runs the launcher as a process.
#
#   5. linux — 1 and 3 above, run on ubuntu-latest against a Homebrew
#      installed fresh via Homebrew's own setup-homebrew action, since
#      Linux runners don't ship it the way macos-latest does. 2 is
#      left out there: a fresh Linuxbrew has no formulae installed on
#      request, so it would just skip on every run.
#
#   6. preset-fixtures — --preset's CLI error paths (missing name,
#      unknown preset, a preset with no real commands in it), plus a
#      real tmux session: right pane count on first launch, reattach
#      instead of duplicating on a second one while it's still alive.
#      Every real session-building invocation runs with SSH_TTY set
#      (forcing preset_show_session()'s SSH-simulated branch) — added
#      after one of these hung for real on a machine with Ghostty.app
#      installed: run_preset() calls preset_show_session() once the
#      panes are built (not just on a reattach), which without this
#      attempts real Ghostty AppleScript automation and can block for
#      minutes rather than failing fast. None of what these steps
#      actually check depends on which "show" path runs.
#
#   7. preset-order-fixtures — --internal-preset-tab, the handler
#      behind Create Preset's numbered Tab marking: marks build up in
#      order, unmarking one renumbers the rest down rather than
#      leaving a gap, and an empty highlighted argument (the "just
#      seed the initial screen" mode) only regenerates without
#      toggling anything.
#
#   8. terminal-auto-fixtures — resolve_auto_terminal(), sourced and
#      called directly: over SSH already inside tmux resolves to tmux,
#      over SSH otherwise (via any of the three SSH env vars) resolves
#      to current, and locally resolves to ghostty or current
#      depending on whether Ghostty.app is actually present on the
#      runner. No fzf, brew, or tmux needed.
#
#   9. relaunch-fixtures — quitting a launched tool relaunches the
#      launcher rather than dropping to a plain shell.
#      launch_in_current_terminal() is sourced and actually run (in a
#      subshell, so its exec doesn't take out the test) against a fake
#      stand-in launcher; launch_in_tmux()/launch_in_ghostty() are
#      covered as source-text assertions since they need a real tmux
#      session / Ghostty.app to run end to end.
#
#   10. rename-fixtures — rename_category()/rename_preset() (F2/F9,
#       Ctrl-R): source-text assertions for the reserved-name/invalid-
#       name/collision guards and the actual mv, same reasoning as
#       category-fixtures.sh already documents for toggle_category() —
#       the text entry itself calls fzf, so driving it headlessly needs
#       either a real TTY or a drive-by refactor of working code purely
#       to make it testable, not attempted here. The full interactive
#       flow was verified live in a real tmux pane instead. Also checks
#       (and, via a real fzf invocation, reproduces) the "renaming to a
#       name that still fuzzy-matches the old one silently does
#       nothing" bug — --print-query's output must be read with
#       head -n1, not tail -n1.
#
#   11. backup-fixtures — create_backup() (Actions → Backup): no fzf
#       involved at all, so this one is sourced and actually run
#       against a fixture $CONFIG_DIR, then the resulting archive is
#       inspected for real — a Brewfile and the fixture category/
#       preset/config files, none of brew-launcher's own staging logs
#       leaking in alongside them, and a clean failure with no partial
#       archive left behind when brew isn't on PATH. Skips if brew
#       itself isn't available.
#
#   12. version-marker-fixtures — launcher_update_marker()/
#       screen_border_label(): sourced and called directly against a
#       hand-populated outdated_formulas, no fzf/brew/tmux needed.
#
#   13. picker-details-fixtures — the F3 preview subcommands behind F2
#       and F9's own details pane (--internal-preview-category,
#       --internal-preview-preset): plain CLI subcommands with no
#       fzf/interactivity of their own, driven directly against a
#       fixture cache/categories/presets dir. F2/F9's own wiring (the
#       f3 key pointed at the right subcommand) is a source-text
#       assertion, same reasoning as rename-fixtures.sh.
#
#   14. preset-in-details-fixtures — "which presets is this command
#       in?" in the main list's own F3 pane: --internal-preview is a
#       plain CLI subcommand too, driven directly against a fixture
#       cache (containing the real @@PRESETS@@ marker a real cache
#       build embeds) and a fixture PRESETS_DIR. No fzf/brew/tmux
#       needed.
#
#   15. sort-fixtures — SORT_ORDER=size (Actions → Sort): size_sort_key()
#       (parsing a display string like "1.7MB" into bytes) and
#       build_entries()'s reuse of it, sourced and run directly against
#       a fixture cache, same technique computed-view-fixtures.sh
#       already uses for Most Used/Recently Added. No fzf/brew/tmux
#       needed.
#
#   16. actions-menu-fixtures — three small things raised live in one
#       batch: F1/[Help] actually appearing (and last) in
#       footer_actions(), F9 (Launch Preset) working from the view
#       picker (F2) too, and a "Details" toggle in Actions mirroring
#       F3 itself. Mostly source-text assertions, same reasoning as
#       rename-fixtures.sh for the pickers themselves; footer_actions()
#       specifically is checked as text too, not sourced and run —
#       it trips a real zsh quirk under this test's own `set -u`
#       unrelated to anything shipped here (`${(l:$gap:: :)}` reports
#       "parameter not set" in strict mode even though the real script
#       never runs under set -u). Extended for a second live batch: the
#       Alt Keybinds toggle (wired end to end, checked as source text
#       for the same `${(l:...)}`-under-set -u reason as above) and
#       Actions' own always-on F3 details pane, whose content
#       (--internal-preview-action) IS run directly — it's a plain CLI
#       subcommand, no fzf involved. Extended again for the Actions row
#       restructure (Launch Preset removed, Create Preset/Create
#       Shortcut moved under Categorize) and once more for the
#       Actions/Settings split — every standing preference (Theme,
#       bundled-defaults toggles, Open to Categories, Sort, Details,
#       Alt Keybinds) moved out of pick_more_action()/open_more_menu()
#       into a new pick_settings_action()/open_settings_menu() pair,
#       reached via one "Settings" row, so Actions only holds one-shot
#       actions.
#
#   17. prune-stale-favorites-fixtures — prune_stale_category_members()
#       (a Favorites/category count that looked wrong because it
#       silently excluded no-longer-installed entries forever, rather
#       than ever cleaning them out): sourced and run directly against
#       a fixture categories dir and cache. No fzf/brew/tmux needed.
#
#   18. picker-footer-fixtures — build_picker_footer() (the F2/F9
#       pickers' own width-aware footer, added once their static one
#       grew wide enough that fzf started truncating it mid-word):
#       sourced and called directly with terminal_width() overridden.
#       No fzf/brew/tmux needed. Extended for the Alt Keybinds toggle:
#       each action is now a spec (FKEY/LETTER/label) rather than an
#       already-built string, so this picker footer can show the same
#       ⌥ aliases the main list's own footer does, gated by the same
#       CONFIG_ALT_KEYBINDS toggle.
#
#   19. function-order-fixtures — a static check (embedded python3, no
#       fzf/brew/tmux) that no top-level codepath (one that can run
#       before the main loop, like Actions -> Open to Categories'
#       startup pick_view() call) can reach a function that isn't
#       defined yet at that point in the file. zsh doesn't hoist
#       function definitions, so this class of bug is silent at
#       write-time and only shows up live: raised via a screenshot,
#       "bottom menu is missing when launching into view screen
#       (toggle on)" — pick_view() reached build_picker_footer(),
#       defined hundreds of lines later, and several Actions rows
#       (Create Preset, Backup, every settings toggle) turned out to
#       be broken the same way. Fixed by moving the Open to Categories
#       startup trigger itself to just before the main loop, after
#       every function in the script has been defined, rather than
#       chasing each broken function one at a time.
#
#   20. bulk-actions-fixtures — Hide Multiple/Favorite Multiple/
#       Categorize Multiple: add_to_favorites()/add_to_category()
#       (ensure-membership helpers, never removing, that a bulk action
#       needs but the existing per-entry toggles don't provide) and
#       pick_category_name() (the category prompt pulled out of
#       toggle_category() so a bulk action can ask once for a whole
#       batch) are pure filesystem functions, sourced and run directly.
#       pick_multiple_entries()/bulk_hide()/bulk_favorite()/
#       bulk_categorize() themselves call fzf, so they're checked as
#       source text, same reasoning as rename-fixtures.sh.
#
#   21. bulk-cancel-and-quit-confirm-fixtures — two live reports fixed
#       together: bulk_categorize() falling through to its category
#       prompt after Esc instead of cancelling (a zsh quirk —
#       `${(@f)$(cmd)}` on empty output is a one-element array, not a
#       zero-element one), and a Quit/Cancel confirm before Esc on
#       "All" actually exits (previously immediate, easy to hit by
#       accident). bulk_hide()/bulk_favorite()/bulk_categorize() are
#       driven for real by stubbing pick_multiple_entries(), same
#       technique relaunch-fixtures.sh uses; confirm_quit() itself
#       calls fzf, checked as source text.
#
#   22. diagnose-fixtures — --diagnose (Requirements/config/cache
#       health check, run as its own process): exits 0 with only
#       [warn] lines against a totally fresh install, reports the real
#       cache format version/entry count/category+preset counts
#       against a populated one, treats a stale cache format as a
#       [warn] rather than a [FAIL], and — the one behavior a real-
#       machine smoke test can't exercise, since the runner always has
#       every dependency — correctly reports [FAIL] plus a nonzero
#       exit for a genuinely missing required dependency, simulated
#       via a restricted PATH rather than touching the real
#       environment.
#
#   23. security-fixtures — properties SECURITY.md claims, each with a
#       real regression guard rather than just a source-text check
#       where execution is possible: the cache-writer's python3
#       heredoc is extracted and run directly (a fake `brew` on PATH
#       stands in for the one real `brew leaves` call it makes) against
#       a crafted formula description containing an embedded tab and
#       newline, confirming it can't shift or split a cache row (caught
#       a real gap this way — descriptions are tap-maintainer free
#       text, not constrained by Homebrew's own name-safety rules, and
#       weren't sanitized before this); a config file with shell-
#       metacharacter values is confirmed never executed (a canary file
#       the payload would create if it were) and a malformed value is
#       cleanly rejected via the real --list path; every mktemp call in
#       the script is checked for a randomized template; and the four
#       places a typed name becomes a filename (pick_category_name,
#       create_preset, rename_category, rename_preset) are checked for
#       their "/" and leading "." guard, plus a source-text check that
#       Enter still prefers the cache's resolved path over a fresh PATH
#       lookup (inline in the main loop, not its own function — same
#       "no drive-by refactor" reasoning as rename-fixtures.sh).
#
#   24. details-position-fixtures — Settings -> Details Position,
#       raised live: "Toggle for details pane on the top or bottom."
#       details_preview_window() (the shared --preview-window builder
#       every one of the five details/preview screens now goes
#       through) is pure, sourced and called directly; the Settings
#       row/dispatch are source-text assertions, same reasoning as
#       actions-menu-fixtures.sh.
#
#   25. edit-preset-fixtures — F9's Ctrl-E, raised live: "option to
#       rearrange TUIs in existing presets." --internal-preset-tab (a
#       plain CLI subcommand, already covered by preset-order-
#       fixtures.sh) is driven for real here too, specifically for the
#       part that's new: seeding PRESET_ORDER_STATE_FILE from an
#       existing preset's members/order instead of starting blank, and
#       confirming unmark-then-remark actually reorders. edit_preset()
#       itself and launch_preset()'s Ctrl-E wiring are source-text
#       assertions, same reasoning as rename-fixtures.sh.
#
#   26. update-all-fixtures — Actions -> Update All, raised live:
#       "Action to launch TUI update or update all TUIs with command?"
#       update_all() is driven for real: a fake `brew` on PATH stands
#       in for the real one (this must never touch the real Homebrew
#       install), confirm_update_all() is stubbed as a call-counter
#       (same technique bulk-cancel-and-quit-confirm-fixtures.sh uses),
#       and the real launch_in_current_terminal() actually runs (in a
#       subshell, same reasoning relaunch-fixtures.sh gives) against a
#       fake stand-in launcher, confirming the generated script calls
#       brew, cleans up after itself, and relaunches bare rather than
#       forcing any special flag.
#
#   27. launch-flags-fixtures — Actions -> Launch Flags, raised live:
#       "Actions: option to always run TUI with specific commands?" /
#       "Presets: action to run with specific commands?"
#       resolve_launch_path() and set_launch_flags() are pure, sourced
#       and run directly; a real --preset run (SSH_TTY-simulated, same
#       reasoning preset-fixtures.sh gives for its own use of that)
#       confirms a configured preset member actually launches with its
#       flags applied — this is also what caught a real function-order
#       bug before it shipped (resolve_launch_path() unreachable from
#       the top-level --preset dispatch in its original position; see
#       this file's own header comment, including why
#       function-order-fixtures.sh's own static check does not catch
#       this particular shape). pick_launch_flags() and the Actions
#       wiring are source-text assertions, same reasoning as
#       rename-fixtures.sh.
#
#   28. compact-view-fixtures — Actions -> Settings -> Compact View,
#       raised live: "detailed vs clean view." build_entries() is
#       sourced and run against a fixture cache, same technique
#       sort-fixtures.sh uses for SORT_ORDER=size, confirming the
#       VERSION/SIZE text is genuinely absent (not just blank) from
#       the display string when compact. The column header and
#       Settings row/dispatch are source-text assertions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: zsh -n bin/brew-launcher
        run: zsh -n bin/brew-launcher

      - name: python3 -m py_compile lib/brew-launcher/cache_writer.py
        run: python3 -m py_compile lib/brew-launcher/cache_writer.py

  cache-roundtrip:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The launcher refuses to start without fzf, and runners don't
      # ship it. python3 and brew are already present.
      - name: Install fzf
        run: brew install fzf

      - name: Cache round-trip smoke test
        run: zsh test/cache-roundtrip.sh

  list-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fzf
        run: brew install fzf

      - name: --list fixture test
        run: zsh test/list-fixtures.sh

  category-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf install needed here — this test sources
      # load_category_names() directly rather than running the
      # launcher as a process, so it has no dependency on fzf being
      # present.
      - name: Category loading test
        run: zsh test/category-fixtures.sh

  ignore-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hide/unhide test
        run: zsh test/ignore-fixtures.sh

  dedup-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Duplicate command name test
        run: zsh test/dedup-fixtures.sh

  computed-view-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Most Used / Recently Added ranking test
        run: zsh test/computed-view-fixtures.sh

  theme-config-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fzf
        run: brew install fzf

      - name: Theme and config file test
        run: zsh test/theme-config-fixtures.sh

  preset-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fzf and tmux
        run: brew install fzf tmux

      - name: Preset (--preset) test
        run: zsh test/preset-fixtures.sh

  preset-order-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf or tmux install needed — --internal-preset-tab is
      # handled before the dependency checks, the same reason the
      # footer-click and preview handlers it's modeled on don't need
      # them either.
      - name: Create Preset's Tab-order handler test
        run: zsh test/preset-order-fixtures.sh

  terminal-auto-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — resolve_auto_terminal() is
      # sourced and called directly against real env vars, same
      # technique category-fixtures.sh already uses.
      - name: Auto terminal-backend detection test
        run: zsh test/terminal-auto-fixtures.sh

  relaunch-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — launch_in_current_terminal() is
      # sourced and run for real (in a subshell, so its exec doesn't
      # take out the test) against a fake stand-in launcher; the tmux
      # and Ghostty paths are covered as source-text assertions since
      # they need a real tmux session / Ghostty.app to run end to end.
      - name: Relaunch-after-quit test
        run: zsh test/relaunch-fixtures.sh

  rename-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — source-text assertions only,
      # same reasoning category-fixtures.sh already documents for
      # toggle_category(): the actual text entry calls fzf, so it
      # isn't driven headlessly here, per the project's "no drive-by
      # refactors" stance.
      - name: Rename category/preset test
        run: zsh test/rename-fixtures.sh

  preset-in-details-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — --internal-preview is a plain
      # CLI subcommand, driven directly against a fixture cache
      # (containing the real @@PRESETS@@ marker) and a fixture
      # PRESETS_DIR.
      - name: Command-in-which-presets test
        run: zsh test/preset-in-details-fixtures.sh

  sort-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — size_sort_key() and
      # build_entries() are sourced and run directly against a
      # fixture cache, same technique computed-view-fixtures.sh
      # already uses for Most Used/Recently Added.
      - name: Sort-by-size test
        run: zsh test/sort-fixtures.sh

  actions-menu-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — mostly source-text assertions,
      # same reasoning as rename-fixtures.sh for the pickers themselves.
      - name: F1/F9/Details wiring test
        run: zsh test/actions-menu-fixtures.sh

  prune-stale-favorites-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — prune_stale_category_members()
      # is sourced and run directly against a fixture categories dir
      # and cache.
      - name: Stale category-member pruning test
        run: zsh test/prune-stale-favorites-fixtures.sh

  backup-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # create_backup() is sourced and actually run against a fixture
      # $CONFIG_DIR — no fzf involved, so unlike rename this one isn't
      # limited to source-text assertions.
      - name: Backup test
        run: zsh test/backup-fixtures.sh

  version-marker-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — launcher_update_marker() and
      # screen_border_label() are sourced and called directly against
      # a hand-populated outdated_formulas.
      - name: Version-marker test
        run: zsh test/version-marker-fixtures.sh

  picker-details-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — the F3 preview subcommands are
      # plain CLI, driven directly against a fixture cache/categories/
      # presets dir.
      - name: F2/F9 details-pane test
        run: zsh test/picker-details-fixtures.sh

  picker-footer-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — build_picker_footer() is
      # sourced and called directly, with terminal_width() overridden
      # after sourcing. No set -u here (see the test file's own
      # comment) — it uses the same ${(l:...)} padding idiom that
      # trips a genuine zsh strict-mode quirk elsewhere in this suite.
      - name: F2/F9 footer width test
        run: zsh test/picker-footer-fixtures.sh

  function-order-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — a static check (embedded
      # python3, already a project dependency) over the script's own
      # source text: no top-level call can reach a function defined
      # later in the file than the call site itself.
      - name: Function-definition-order test
        run: zsh test/function-order-fixtures.sh

  bulk-actions-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — add_to_favorites()/
      # add_to_category()/pick_category_name() are pure filesystem
      # functions, sourced and run directly against a fixture
      # $CONFIG_DIR. bulk_hide()/bulk_favorite()/bulk_categorize()/
      # pick_multiple_entries() themselves call fzf, so they're checked
      # as source text, same reasoning as rename-fixtures.sh.
      - name: Bulk Hide/Favorite/Categorize test
        run: zsh test/bulk-actions-fixtures.sh

  bulk-cancel-and-quit-confirm-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No fzf, brew, or tmux needed — bulk_hide()/bulk_favorite()/
      # bulk_categorize() are driven for real by stubbing
      # pick_multiple_entries() (their one fzf call) to simulate Esc
      # (prints nothing) or a single accepted row, same technique
      # relaunch-fixtures.sh uses to drive a function past its one
      # fzf/exec call. confirm_quit() itself calls fzf, so it's checked
      # as source text, same reasoning as rename-fixtures.sh.
      - name: Bulk-action Esc / quit-confirm test
        run: zsh test/bulk-cancel-and-quit-confirm-fixtures.sh

  diagnose-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fzf
        run: brew install fzf

      - name: --diagnose test
        run: zsh test/diagnose-fixtures.sh

  security-fixtures:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

