name: Update Homebrew tap formula

# Fires whenever a release tag is pushed (e.g. v0.2.1). Downloads that
# tag's source tarball, computes its sha256, and pushes an updated
# Formula/brew-launcher.rb directly to ltdan-88/homebrew-brew-launcher.
#
# Requires a repo secret HOMEBREW_TAP_TOKEN: a PAT with write access to
# the homebrew-brew-launcher repo (contents: read/write is enough for a
# fine-grained token). The default GITHUB_TOKEN cannot push to a
# different repository, so this secret is mandatory.

on:
  push:
    tags:
      - "v*.*.*"

# contents: write is required by the "Create GitHub Release" step below.
# The tap push uses HOMEBREW_TAP_TOKEN instead, since GITHUB_TOKEN can
# never reach a different repository regardless of permissions.
permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout brew-launcher
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify script VERSION matches tag
        run: |
          script_version="$(grep -m1 '^VERSION=' bin/brew-launcher | sed -E 's/VERSION="([^"]+)"/\1/')"
          if [[ "$script_version" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::bin/brew-launcher VERSION ($script_version) does not match tag ${{ steps.version.outputs.tag }}"
            exit 1
          fi

      - name: Download release tarball and compute sha256
        id: sha
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.version.outputs.tag }}.tar.gz"
          curl -sSL --fail -o release.tar.gz "$url"
          sha256="$(sha256sum release.tar.gz | cut -d' ' -f1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-brew-launcher tap
        uses: actions/checkout@v4
        with:
          repository: ltdan-88/homebrew-brew-launcher
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        env:
          FORMULA_PATH: tap/Formula/brew-launcher.rb
          VERSION: ${{ steps.version.outputs.version }}
          URL: ${{ steps.sha.outputs.url }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          python3 - "$FORMULA_PATH" "$VERSION" "$URL" "$SHA256" <<'PY'
          import re
          import sys

          path, version, url, sha256 = sys.argv[1:5]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(r'url ".*"', f'url "{url}"', content, count=1)
          content = re.sub(r'sha256 ".*"', f'sha256 "{sha256}"', content, count=1)
          content = re.sub(
              r'brew-launcher \d+\.\d+\.\d+',
              f'brew-launcher {version}',
              content,
              count=1,
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Remove stray tarball artifacts
        run: rm -f tap/Formula/*.tar.gz

      - name: Commit and push formula update
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "Update brew-launcher formula to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      # Runs after the tap is updated, so a release never advertises a
      # version the tap can't install yet. Notes come from CHANGELOG.md
      # when that version has a section, otherwise GitHub generates them
      # from the commit log.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone"
            exit 0
          fi

          notes_file="$(mktemp)"

          # Pull just this version's section out of the changelog:
          # from its "## [x.y.z]" heading up to the next "## " heading.
          if [[ -f CHANGELOG.md ]] && grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            awk -v v="^## \\\\[$VERSION\\\\]" '
              $0 ~ v {found=1; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md > "$notes_file"
          fi

          if [[ -s "$notes_file" ]]; then
            printf '\n---\n\n```bash\nbrew install ltdan-88/brew-launcher/brew-launcher\n```\n' >> "$notes_file"
            gh release create "$TAG" --title "$TAG" --notes-file "$notes_file"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
